<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utiliarr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="hidden card narrow">
  <h1>Utiliarr</h1>
  <form id="loginForm">
    <p id="setupMsg" class="mut hidden">First run: choose an admin password (min 8 characters).</p>
    <input type="password" id="pw" placeholder="Admin password" autofocus>
    <button id="loginBtn">Log in</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>
<div id="app" class="hidden">
  <header>
    <h1>Utiliarr</h1>
    <nav>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="settings">Settings</button>
      <button id="logout">Log out</button>
    </nav>
  </header>
  <main>
    <section id="dashboard">
      <div class="card"><h2>Download queue <small id="qsum"></small></h2><div id="queue"></div></div>
      <div class="card"><h2>Now playing</h2><div id="playing"></div></div>
      <div class="card"><h2>Active reports</h2><div id="active"></div></div>
    </section>
    <section id="reports" class="hidden"><div class="card"><h2>Report history</h2><div id="reportTable"></div></div></section>
    <section id="settings" class="hidden">
      <form id="settingsForm"></form>
      <form id="pwForm" class="card"><h2>Admin password</h2>
        <div class="row"><input type="password" id="pwCur" placeholder="Current password" autocomplete="current-password" required>
        <input type="password" id="pwNew" placeholder="New password (min 8)" autocomplete="new-password" required minlength="8">
        <button>Change</button></div><p id="pwMsg"></p></form>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
